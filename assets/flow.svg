" y="202" fill="#6b6c71" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15">short spoken turns, euros</text><text x="442" y="226" fill="#6b6c71" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15">replies &gt; 30 words get cut</text><rect x="630.0" y="132" width="106.0" height="24" rx="12" fill="none" stroke="#F47A1F"/><text x="683.0" y="149" text-anchor="middle" fill="#F47A1F" font-family="ui-monospace, 'JetBrains Mono', 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="13">Sonnet 5.5</text><rect x="880" y="116" width="280" height="200" rx="10" fill="#141417" stroke="#2a2b2f"/><rect x="880" y="116" width="6" height="200" rx="3" fill="#9FD3FF"/><text x="902" y="150" fill="#ffffff" font-family="ui-monospace, 'JetBrains Mono', 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="19" font-weight="600">menu.py</text><text x="902" y="178" fill="#e6e6e3" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15">plain Python, no AI</text><text x="902" y="202" fill="#6b6c71" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15">list_menu · get_item</text><text x="902" y="226" fill="#6b6c71" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15">find_dishes_without</text><text x="902" y="250" fill="#6b6c71" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15">dessert_of_the_day</text><text x="902" y="274" fill="#6b6c71" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15">add_to_order · get_order</text><rect x="1083.0" y="132" width="63.0" height="24" rx="12" fill="none" stroke="#9FD3FF"/><text x="1114.5" y="149" text-anchor="middle" fill="#9FD3FF" font-family="ui-monospace, 'JetBrains Mono', 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="13">tools</text><path d="M290 166 L418 166" stroke="#6b6c71" stroke-width="