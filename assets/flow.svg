<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-label="Agentic flow. The call: a guest agent speaks to a waiter agent, both Claude Sonnet 5.5; the waiter calls plain Python menu tools for every price and ingredient. The show: the transcript is saved to scenes, Claude adds one audio tag per line, ElevenLabs Text to Dialogue with Eleven v4 voices it, and the mp3 comes out with timestamps.">
<style>.flow{animation:dash 1.4s linear infinite}@keyframes dash{to{stroke-dashoffset:-22}}@media (prefers-reduced-motion: reduce){.flow{animation:none}}</style>
