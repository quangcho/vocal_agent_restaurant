la + a guest voice</text><rect x="778.6" y="412" width="97.39999999999999" height="24" rx="12" fill="none" stroke="#B79CFF"/><text x="827.3" y="429" text-anchor="middle" fill="#B79CFF" font-family="ui-monospace, 'JetBrains Mono', 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="13">Eleven v4</text><rect x="940" y="396" width="250" height="124" rx="10" fill="#141417" stroke="#2a2b2f"/><rect x="940" y="396" width="6" height="124" rx="3" fill="#ffffff"/><text x="962" y="430" fill="#ffffff" font-family="ui-monospace, 'JetBrains Mono', 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="19" font-weight="600">audio/*.mp3</text><text x="962" y="458" fill="#e6e6e3" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15">phone ring + the call</text><text x="962" y="482" fill="#6b6c71" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15">timestamps per line</text><text x="962" y="506" fill="#6b6c71" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15">for synced subtitles</text><path d="M292 458 L336 458" stroke="#6b6c71" stroke-width="1.6" fill="none" marker-end="url(#a)"/><path d="M592 458 L636 458" stroke="#6b6c71" stroke-width="1.6" fill="none" marker-end="url(#a)"/><path d="M892 458 L936 458" stroke="#6b6c71" stroke-width="1.6" fill="none" marker-end="url(#a)"/><path d="M720 248 L720 330 L165 330 L165 392" stroke="#6b6c71" stroke-width="1.6" fill="none" marker-end="url(#a)" stroke-dasharray="5 6" class="flow"/><text x="560" y="322" text-anchor="middle" fill="#6b6c71" font-family="ui-monospace, 'JetBrains Mono', 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="13">hang up → save</text>
