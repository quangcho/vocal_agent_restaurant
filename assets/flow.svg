<rect x="0.5" y="0.5" width="1199" height="559" rx="6" fill="#0e0e10" stroke="#2a2b2f"/>
<line x1="0" y1="56" x2="1200" y2="56" stroke="#2a2b2f"/>
<circle cx="32" cy="28" r="6" fill="#ff5f57"/><circle cx="52" cy="28" r="6" fill="#febc2e"/><circle cx="72" cy="28" r="6" fill="#28c840"/>
