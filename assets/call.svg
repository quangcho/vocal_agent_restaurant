<g font-family="ui-monospace, 'JetBrains Mono', 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="21"><g class="r k0"><text x="48" y="112" fill="#ffffff">$</text><text x="74" y="112" fill="#ffffff" xml:space="preserve">python scripts/simulate.py --only vegetarian</text></g><g class="r k1"><text x="68" y="148" fill="#6b6c71">ring</text><text x="200" y="148" fill="#6b6c71" xml:space="preserve">phone ringing</text></g><g class="r k2"><text x="68" y="184" fill="#F47A1F">waiter</text><text x="200" y="184" fill="#e6e6e3" xml:space="preserve">“Gino Pizza, good evening! What can I get started for you?”</text></g><g class="r k3"><text x="68" y="220" fill="#FF9EC4">guest</text><text x="200" y="220" fill="#e6e6e3" xml:space="preserve">“Hi! I&#x27;m vegetarian, so is your margherita made with</text></g><g class="r k4"><text x="68" y="256" fill="#6b6c71"></text><text x="200" y="256" fill="#e6e6e3" xml:space="preserve"> vegetarian-friendly cheese, no animal rennet?”</text></g><g class="r k5"><text x="68" y="292" fill="#6b6c71">call</text><text x="200" y="292" fill="#9FD3FF" xml:space="preserve">list_menu()</text></g><g class="r k6"><text x="68" y="328" fill="#6b6c71">←</text><text x="200" y="328" fill="#e6e6e3" xml:space="preserve">5 pizzas · 5 desserts · 5 drinks · free delivery</text></g><g class="r k7"><text x="68" y="364" fill="#6b6c71">call</text><text x="200" y="364" fill="#9FD3FF" xml:space="preserve">get_item(&quot;margherita&quot;)</text></g><g class="r k8"><text x="68" y="400" fill="#6b6c71">←</text><text x="200" y="400" fill="#e6e6e3" xml:space="preserve">mozzarella: vegetarian microbial rennet · 13.00 EUR</text></g><g class="r k9"><text x="68" y="436" fill="#F47A1F">waiter</text><text x="200" y="436" fill="#e6e6e3" xml:space="preserve">“Good news: our mozzarella is made with vegetarian</text></g><g class="r k10"><text x="68" y="472" fill="#6b6c71"></text><text x="200" y="472" fill="#e6e6e3" xml:space="preserve"> microbial rennet… It&#x27;s thirteen euros. Shall I add one?”</text></g><g class="r k11"><text x="68" y="508" fill="#6b6c71">call</text><text x="200" y="508" fill="#9FD3FF" xml:space="preserve">add_to_order(&quot;margherita&quot;) · add_to_order(&quot;sparkling-water&quot;)</text></g><g class="r k12"><text x="68" y="544" fill="#6b6c71">call</text><text x="200" y="544" fill="#9FD3FF" xml:space="preserve">get_order()</text></g><g class="r k13"><text x="68" y="580" fill="#6b6c71">←</text><text x="200" y="580" fill="#e6e6e3" xml:space="preserve">total 16.50 EUR · delivery 0</text></g><g class="r k14"><text x="68" y="616" fill="#6b6c71">direct</text><text x="200" y="616" fill="#FFD60A" xml:space="preserve">[reassuringly, light Italian accent] ← one tag per line</text></g><g class="r k15"><text x="68" y="652" fill="#6b6c71">voice</text><text x="200" y="652" fill="#B79CFF" xml:space="preserve">eleven_v4_turbo · Text to Dialogue · Bella + Sarah</text></g><g class="r k16"><text x="68" y="688" fill="#C9F27B">done</text><text x="200" y="688" fill="#ffffff" xml:space="preserve">audio/vegetarian.mp3 · 39.3 s · 7 lines</text></g><rect class="r k16 cur" x="697.4" y="670" width="11" height="23" fill="#ffffff"/></g>
